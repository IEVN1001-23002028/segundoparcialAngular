<div class="min-h-screen bg-gray-100 flex items-center justify-center p-6">
  <div class="bg-white shadow-lg rounded-xl w-full max-w-5xl p-8">

    <div class="grid grid-cols-1 md:grid-cols-2 gap-10">

      <div class="md:border-r md:pr-10">

        <h2 class="text-2xl font-semibold mb-6 text-center">
          Datos Personales
        </h2>

        <form [formGroup]="formulario" (ngSubmit)="imprimir()" class="flex flex-col gap-4">

          <div class="flex flex-col gap-1">
            <label class="font-medium">Nombre: </label>
            <input type="text" formControlName="nombre" class="border border-gray-300 rounded-md px-3 py-2">
          </div>

          <div class="flex flex-col gap-1">
            <label class="font-medium">Apellido paterno: </label>
            <input type="text" formControlName="apellidoPaterno" class="border border-gray-300 rounded-md px-3 py-2">
          </div>

          <div class="flex flex-col gap-1">
            <label class="font-medium">Apellido materno: </label>
            <input type="text" formControlName="apellidoMaterno" class="border border-gray-300 rounded-md px-3 py-2">
          </div>

          <div>
            <p class="font-medium mb-2 text-center">Fecha de nacimiento: </p>

            <div class="grid grid-cols-3 gap-3">

              <div class="flex flex-col gap-1">
                <label class="text-sm text-center">Día: </label>
                <input type="number" formControlName="dia" class="border border-gray-300 rounded-md px-3 py-2 w-full">
              </div>

              <div class="flex flex-col gap-1">
                <label class="text-sm text-center">Mes: </label>
                <input type="number" formControlName="mes" class="border border-gray-300 rounded-md px-3 py-2 w-full">
              </div>

              <div class="flex flex-col gap-1">
                <label class="text-sm text-center">Año: </label>
                <input type="number" formControlName="year" class="border border-gray-300 rounded-md px-3 py-2 w-full">
              </div>
            </div>
          </div>

          <div>
            <p class="font-medium mb-2 text-center">Sexo: </p>

            <div class="flex justify-center gap-6">
              <label class="flex items-center gap-2">
                <input type="radio" value="Masculino" formControlName="sexo">Masculino
              </label>

              <label class="flex items-center gap-2">
                <input type="radio" value="Femenino" formControlName="sexo">Femenino
              </label>

            </div>
          </div>
          <button type="submit" class="bg-black text-white rounded-md px-4 py-2 mt-4 hover:bg-gray-800">Imprimir</button>
        </form>

      </div>

      <div class="flex flex-col items-center justify-center text-center min-h-96">

        @if (mostrarResultado) {
          <p class="text-xl mb-4"> Hola <span class="font-bold"> {{ resultado.nombreCompleto }} </span></p>
          <p class="text-xl mb-4">Tienes <span class="font-bold"> {{ resultado.edad }} </span> años </p>
          <p class="text-lg mb-2"> Tu signo zodiacal chino es: </p>
          <p class="text-3xl font-bold mb-4">{{ resultado.signo }}</p>
          <img [src]="resultado.imagen" [alt]="resultado.signo" class="w-40 h-40 object-contain">

        } @else {
          <p class="text-gray-400"> Completa el formulario y presiona Imprimir </p>
        }
      </div>
    </div>
  </div>
</div>
